<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts</title>
  <!-- 1. 加载 ECharts CDN 库（核心：无需本地文件，公网可访问） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    /* 2. 样式重置：消除白边、适配 iframe 100% 宽高 */
    * {margin:0;padding:0;box-sizing:border-box}
    html,body {width:100%;height:100%;overflow:hidden} /* overflow:hidden 防止滚动条 */
    #main {width:100%;height:100%} /* 图表容器占满整个页面 */
  </style>
</head>
<body>
<div id="main"></div> <!-- 3. 图表挂载容器 -->
<script>
// 4. 初始化 ECharts 实例
const chartDom = document.getElementById('main');
const myChart = echarts.init(chartDom);
// 5. 图表配置（可替换为自定义配置，比如示例中的政策扶持数据）
const option = {
  backgroundColor: 'transparent', // 关键：适配 Readymag 背景透明
  xAxis: {type: 'category', data: ['周一','周二','周三','周四','周五','周六','周日']},
  yAxis: {type: 'value'},
  series: [{type: 'bar', data: [120,200,150,80,70,110,130]}]
};
myChart.setOption(option); // 6. 渲染图表
// 7. 适配 iframe 缩放：窗口大小变化时重绘图表
window.addEventListener('resize', ()=>myChart.resize())
</script>
</body>
</html>
